name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Each job syncs once with `uv sync --extra cpu`. Without this, every `uv run` would sync again
  # without the extra and install PyPI's CUDA build of PyTorch (several GB) on top.
  UV_NO_SYNC: "1"

jobs:
  test:
    name: Lint and fast tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install dependencies (CPU PyTorch)
        run: uv sync --extra cpu --locked

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format
        run: uv run ruff format --check .

      # mypy and pytest-cov are not project dependencies: `--with` adds them to this command
      # only, on top of the synced environment.
      - name: Type check
        run: uv run --with mypy mypy

      - name: Fast tests with coverage
        run: uv run --with pytest-cov pytest --cov=c2p --cov-report=term-missing:skip-covered

  notebooks:
    name: Notebooks (fast mode, CPU)
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      C2P_FAST_MODE: "1"
      C2P_DEVICE: cpu
    steps:
      - uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install dependencies (CPU PyTorch)
        run: uv sync --extra cpu --locked

      # Model weights (Hugging Face) and the Kaggle dataset are downloaded on first use.
      - name: Cache models and data downloads
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/huggingface
            ~/.cache/kagglehub
          key: downloads-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: |
            downloads-${{ runner.os }}-

      # 07 and 08 fine-tune the model and need a GPU.
      # --nbmake-kernel: notebooks saved in VS Code can name a local kernel (e.g. ".venv") that
      # does not exist on the runner; python3 is the kernel of the synced environment.
      # --nbmake-timeout: seconds per cell (default 300); a cell that downloads the model or the
      # data on a cold cache can take longer.
      - name: Run notebooks
        run: >-
          uv run pytest --nbmake notebooks/
          --ignore-glob='notebooks/07_*'
          --ignore-glob='notebooks/08_*'
          --nbmake-kernel=python3
          --nbmake-timeout=900
