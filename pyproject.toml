[project]
name = "chronos2-in-practice"
version = "0.1.0"
description = "Companion code for the Medium series 'Chronos-2 in Practice'."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11,<3.14"
dependencies = [
    "chronos-forecasting==2.3.2",
    "fev>=0.10",
    "holidays>=0.80",
    "kagglehub>=1.0",
    "matplotlib>=3.9",
    "numpy>=1.26",
    "pandas>=2.2",
    "peft>=0.18.1",
    "scipy>=1.11",
    "statsforecast>=2.0",
]

[project.optional-dependencies]
# Pick one PyTorch build: `uv sync --extra cpu` or `uv sync --extra cu130`.
# Without either, torch comes from PyPI (CPU on Windows/macOS, CUDA on Linux).
cpu = ["torch==2.14.1"]
cu130 = ["torch==2.14.1"]

[dependency-groups]
notebooks = [
    "ipykernel>=6.29",
    "ipywidgets>=8.1",
    "jupyterlab>=4.2",
]
dev = [
    "nbmake>=1.5",
    "pytest>=8.3",
    "ruff>=0.8",
]

[tool.uv]
default-groups = ["dev", "notebooks"]
conflicts = [[{ extra = "cpu" }, { extra = "cu130" }]]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu130", extra = "cu130", marker = "sys_platform != 'darwin'" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/c2p"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-include = ["*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "NPY", "PD", "RUF"]

[tool.ruff.lint.per-file-ignores]
"*.ipynb" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Slow tests download models or datasets; run them with `uv run pytest -m slow`.
addopts = "-ra --strict-markers -m 'not slow'"
markers = ["slow: downloads models or data from the internet"]
